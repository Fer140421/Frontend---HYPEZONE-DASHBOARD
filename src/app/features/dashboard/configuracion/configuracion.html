
<app-page-header title="Configuración" description="Parámetros comerciales del sistema." />

<mat-card>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="guardarFidelidad()" class="form-grid compact">
      <div class="full">
        <h2>Puntos</h2>
        <h3>Programa de fidelidad</h3>
        <p class="muted">Cada compra con cliente acumula puntos. Una recompensa se usa en una sola prenda.</p>
      </div>
      <mat-form-field appearance="outline">
        <mat-label>Puntos por prenda</mat-label>
        <input matInput type="number" min="1" formControlName="puntosPorPrenda" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Puntos para una recompensa</mat-label>
        <input matInput type="number" min="1" formControlName="puntosParaRecompensa" />
      </mat-form-field>
      <mat-form-field appearance="outline">
        <mat-label>Descuento de recompensa (%)</mat-label>
        <input matInput type="number" min="1" max="100" formControlName="descuentoRecompensaPorcentaje" />
      </mat-form-field>
      <div class="full">
        <button mat-flat-button class="primary-action" type="submit" [disabled]="form.invalid">Guardar configuración</button>
      </div>
    </form>
  </mat-card-content>
</mat-card>
