<h2 mat-dialog-title>Agregar productos al lote</h2>
<mat-dialog-content><p class="muted">Registra un producto y continúa agregando los que necesites.</p>
  <form class="form-grid" [formGroup]="form">
    <mat-form-field appearance="outline"><mat-label>Nombre</mat-label><input matInput formControlName="nombre" /></mat-form-field>
    <div class="catalog-field"><app-searchable-select label="Marca" formControlName="marca" [options]="(marcas$ | async) ?? []" valueKey="nombre" labelKey="nombre" [additionalOptions]="opcionesLocales.marcas()" emptyLabel="Sin definir" /><button mat-icon-button type="button" class="quick-option-button" (click)="agregarOpcionRapida('marca')" matTooltip="Registrar marca" aria-label="Registrar marca"><mat-icon>add</mat-icon></button></div>
    <div class="catalog-field"><app-searchable-select label="Categoría" formControlName="categoria" [required]="true" [options]="(categorias$ | async) ?? []" valueKey="nombre" labelKey="nombre" [additionalOptions]="opcionesLocales.categorias()" /><button mat-icon-button type="button" class="quick-option-button" (click)="agregarOpcionRapida('categoria')" matTooltip="Registrar categoría" aria-label="Registrar categoría"><mat-icon>add</mat-icon></button></div>
    <div class="catalog-field"><app-searchable-select label="Talla" formControlName="talla" [required]="true" [options]="(tallas$ | async) ?? []" valueKey="nombre" labelKey="nombre" [additionalOptions]="opcionesLocales.tallas()" /><button mat-icon-button type="button" class="quick-option-button" (click)="agregarOpcionRapida('talla')" matTooltip="Registrar talla" aria-label="Registrar talla"><mat-icon>add</mat-icon></button></div>
    <app-searchable-select label="Género" formControlName="genero" [options]="generos" emptyLabel="Sin definir" />
    <mat-form-field appearance="outline"><mat-label>Precio compra</mat-label><input matInput type="number" formControlName="precioCompra" /></mat-form-field>
    <mat-form-field appearance="outline"><mat-label>Precio venta</mat-label><input matInput type="number" formControlName="precioVenta" /></mat-form-field>
    <mat-form-field appearance="outline" class="full"><mat-label>Descripción</mat-label><textarea matInput rows="2" formControlName="descripcion"></textarea></mat-form-field>
    <div class="full"><app-image-uploader [images]="imagenes()" [maxImages]="5" (uploaded)="imagenes.set($event)" (uploadingChange)="uploadingPhotos.set($event)" (error)="message($event)" /></div>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button type="button" [disabled]="saving()" (click)="cancel()">Cancelar</button>
  <button mat-flat-button class="primary-action" type="button" [disabled]="form.invalid || saving() || uploadingPhotos()" (click)="saveAndContinue()"><mat-icon>add</mat-icon>{{ saving() ? 'Guardando...' : 'Guardar y agregar otro' }}</button>
</mat-dialog-actions>
