
    <h2 mat-dialog-title>Editar producto</h2>
    <mat-dialog-content>
      <form class="form-grid dialog-form" [formGroup]="form">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="nombre" />
        </mat-form-field>
        <div class="catalog-field">
          <app-searchable-select label="Marca" formControlName="marca" [options]="(marcas$ | async) ?? []" valueKey="nombre" labelKey="nombre" [additionalOptions]="opcionesLocales.marcas()" emptyLabel="Sin definir" />
          <button mat-icon-button type="button" class="quick-option-button" (click)="agregarOpcionRapida('marca')" matTooltip="Registrar marca" aria-label="Registrar marca"><mat-icon>add</mat-icon></button>
        </div>
        <div class="catalog-field">
          <app-searchable-select label="Categoría" formControlName="categoria" [required]="true" [options]="(categorias$ | async) ?? []" valueKey="nombre" labelKey="nombre" [additionalOptions]="opcionesLocales.categorias()" />
          <button mat-icon-button type="button" class="quick-option-button" (click)="agregarOpcionRapida('categoria')" matTooltip="Registrar categoría" aria-label="Registrar categoría"><mat-icon>add</mat-icon></button>
        </div>
        <app-searchable-select label="Lote" formControlName="loteId" [options]="(data.lotes$ | async) ?? []" valueKey="id" labelKey="nombre" emptyLabel="Sin lote" />
        <div class="catalog-field">
          <app-searchable-select label="Talla" formControlName="talla" [required]="true" [options]="(tallas$ | async) ?? []" valueKey="nombre" labelKey="nombre" [additionalOptions]="opcionesLocales.tallas()" />
          <button mat-icon-button type="button" class="quick-option-button" (click)="agregarOpcionRapida('talla')" matTooltip="Registrar talla" aria-label="Registrar talla"><mat-icon>add</mat-icon></button>
        </div>
        <app-searchable-select label="Género" formControlName="genero" [options]="generos" emptyLabel="Sin definir" />
        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="estado">
            @for (opt of estadosManuales; track opt.value) {
              <mat-option [value]="opt.value">{{ opt.label }}</mat-option>
            }
            @if (form.controls.estado.value === 'reservado' || form.controls.estado.value === 'vendido') {
              <mat-option [value]="form.controls.estado.value" [disabled]="true">
                {{ form.controls.estado.value | titlecase }} (Automático)
              </mat-option>
            }
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Precio compra</mat-label>
          <input matInput type="number" formControlName="precioCompra" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Precio venta</mat-label>
          <input matInput type="number" formControlName="precioVenta" />
        </mat-form-field>
        <mat-form-field appearance="outline" class="full">
          <mat-label>Descripcion</mat-label>
          <textarea matInput rows="3" formControlName="descripcion"></textarea>
        </mat-form-field>
        <mat-form-field appearance="outline" class="full">
          <mat-label>Notas</mat-label>
          <textarea matInput rows="2" formControlName="notas"></textarea>
        </mat-form-field>
        <div class="full">
          <app-image-uploader [images]="imagenes()" (uploaded)="imagenes.set($event)" />
        </div>
      </form>
    </mat-dialog-content>
    <mat-dialog-actions align="end">
      <button mat-button type="button" mat-dialog-close>Cancelar</button>
      <button mat-flat-button class="primary-action" type="button" [disabled]="form.invalid" (click)="save()">
        Guardar cambios
      </button>
    </mat-dialog-actions>
