<section class="page-header" [class.has-back]="!!backUrl()">
  <div class="header-content">
    @if (backUrl(); as url) {
      <div class="back-button-wrapper">
        <a mat-button [routerLink]="url" class="btn-back">
          <mat-icon>arrow_back</mat-icon>
          <span>{{ backLabel() }}</span>
        </a>
      </div>
    }
    <div>
      <p class="eyebrow">{{ eyebrow() }}</p>
      <h1>{{ title() }}</h1>
      @if (description()) {
        <p class="muted">{{ description() }}</p>
      }
    </div>
  </div>
  <div class="header-actions">
    <ng-content />
  </div>
</section>
